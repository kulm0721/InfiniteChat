spring:
  application:
    name: GateWay
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/infinitechat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      database: 2
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 30000
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:18375}
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:10010"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 36000
      routes:
        - id: UserService
          uri: lb://UserService
          predicates:
            - Path=/api/user/**
        - id: OfflineDataService
          uri: lb://OfflineDataService
          predicates:
            - Path=/api/message/**
        - id: AiService
          uri: lb://AiService
          predicates:
            - Path=/api/ai/**

server:
  port: 10010
