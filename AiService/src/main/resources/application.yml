spring:
  application:
    name: AiService
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      ttl: 3600
      timeout: 30000
  datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${DB_URL:jdbc:mysql://localhost:3306/infinitechat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:18375}


server:
  port: 8105


logging:
  level:
    dev.langchain4j.mcp: ERROR



langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY}
      streaming-chat-model:
        model-name: qwen-max
        api-key: ${DASHSCOPE_API_KEY}
      embedding-model:
        model-name: qwen3.7-text-embedding
        api-key: ${DASHSCOPE_API_KEY}

bigmodel:
  api-key: ${BIGMODEL_API_KEY}

rag:
  docs-path: ${RAG_DOCS_PATH:src/main/resources/docs}

pgvector:
  database: dp
  host: localhost
  port : 54328
  user: ${PGVECTOR_USERNAME}
  password: ${PGVECTOR_PASSWORD}
  table: dp_embedding

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
